[package]
name = "image-prompt-hub"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "AstrBot 图片生成插件的在线提示词模板服务"

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
flate2 = "1"
governor = "0.10"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "webpki-roots",
] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "macros",
] }
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
tantivy-jieba = "0.21"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "limit",
    "request-id",
    "set-header",
    "timeout",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "6", features = ["axum_extras", "uuid"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
